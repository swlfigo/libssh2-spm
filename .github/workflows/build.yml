name: Fetch Update and Publish Release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

env:
  # libssh2 has no release tag containing the transport.c packet-length OOB fix
  # (CVE-2026-55200, upstream commit 97acf3df). Pin a master commit that contains it.
  # To roll forward: change LIBSSH2_PIN and bump PACKAGE_VERSION.
  LIBSSH2_PIN: 18aebe08962c1878d84c373ad85caff25ec67771
  PACKAGE_VERSION: 1.11.101
  # Fallback only; the job resolves the latest openssl-spm storage release when possible.
  OPENSSL_STORAGE_TAG: storage.4.0.3

jobs:
  fetch-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Determine Release Tag
        run: |
          echo "RELEASE_TAG=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "STORAGE_RELEASE_TAG=storage.$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Check If Compile Required
        run: |
          git fetch --tags
          if git rev-parse "$STORAGE_RELEASE_TAG" >/dev/null 2>&1; then
            echo "[*] tag $STORAGE_RELEASE_TAG already exists, nothing to do"
            echo "UPDATE_NEEDED=false" >> $GITHUB_ENV
          else
            echo "[*] tag $STORAGE_RELEASE_TAG does not exist, building"
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
          fi

      - name: Keepalive (avoid 60-day schedule suspension)
        if: github.event_name == 'schedule' && env.UPDATE_NEEDED == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LAST=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - LAST )) -gt $(( 45*86400 )) ]; then
            git commit --allow-empty -m "chore: keepalive"
            git push origin HEAD
          fi

      - name: Setup Build
        if: env.UPDATE_NEEDED == 'true'
        run: |
          brew install cmake coreutils zip || true
          xcodebuild -version
          cmake --version

      - name: Build If Needed
        if: env.UPDATE_NEEDED == 'true'
        run: |
          EST_URL="https://github.com/${{ github.repository }}/releases/download/$STORAGE_RELEASE_TAG/libssh2.xcframework.zip"
          ./Script/build.sh "$LIBSSH2_PIN" "$OPENSSL_STORAGE_TAG"
          mv ./build/libssh2.xcframework.zip /tmp/libssh2.xcframework.zip
          git clean -fdx -f
          git reset --hard
          mv /tmp/libssh2.xcframework.zip ./libssh2.xcframework.zip
          ./Script/build-manifest.sh libssh2.xcframework.zip "$EST_URL"

      - name: Commit & Push changes
        if: env.UPDATE_NEEDED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "release: $RELEASE_TAG (libssh2 @ $LIBSSH2_PIN)"
          git tag "$RELEASE_TAG"
          git tag "$STORAGE_RELEASE_TAG"
          git push origin HEAD --tags

      - name: Make Storage Release
        if: env.UPDATE_NEEDED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.STORAGE_RELEASE_TAG }}
          body: |
            Binary storage release (libssh2.xcframework, macOS / iOS / iOS Simulator).
            libssh2 commit: `${{ env.LIBSSH2_PIN }}` (contains the CVE-2026-55200 fix; no upstream release tag has it yet).
            Crypto backend: OpenSSL, linked from swlfigo/openssl-spm.
          files: |
            libssh2.xcframework.zip

      - name: Make Release
        if: env.UPDATE_NEEDED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body: |
            Swift package release. libssh2 pinned to `${{ env.LIBSSH2_PIN }}` (includes CVE-2026-55200 fix).
